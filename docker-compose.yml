# Local environment: cp .env.example .env && docker compose up
# Local LLM (optional): docker compose --profile llm up

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fonbulteni
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # 5433 on the host so it does not clash with a natively installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  bulletin-service:
    build: ./bulletin-service
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "postgres".
      DB_URL: jdbc:postgresql://postgres:5432/fonbulteni
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  postgres-data:
  ollama-models:
