spring.application.name=bulletin-service
server.port=8082

# All secrets come from the environment (see .env.example in the repository root).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fonbulteni}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Must be at least 32 bytes (HS256). The application refuses to start when it is empty,
# except in the 'dev' profile, which ships a fixed development-only key.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# TCMB EVDS (ADR 002). Without EVDS_API_KEY the client is disabled and macro sections are skipped.
evds.api-key=${EVDS_API_KEY:}
evds.series.cpi=TP.TUKFIY2025.GENEL
evds.series.usdtry=TP.DK.USD.A.YTL
evds.series.gold=TP.MK.KUL.YTL
evds.series.deposit=TP.TRY.MT06

# Scheduled jobs (Europe/Istanbul). Set jobs.scheduling.enabled=false to keep only the admin triggers.
jobs.scheduling.enabled=true
jobs.daily-price.cron=0 30 19 * * MON-FRI

# Authentication is JWT-only; Boot's default in-memory user (and its logged password) is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
