spring.application.name=bulletin-service
server.port=8082

# All secrets come from the environment (see .env.example in the repository root).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fonbulteni}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Must be at least 32 bytes (HS256). The application refuses to start when it is empty,
# except in the 'dev' profile, which ships a fixed development-only key.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Authentication is JWT-only; Boot's default in-memory user (and its logged password) is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
